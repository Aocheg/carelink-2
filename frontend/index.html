<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CARELINK</title><style>body{font:16px system-ui;margin:0;background:#f4f7fa;color:#17212b}header{background:#075985;color:white;padding:1rem 2rem}main{max-width:1000px;margin:2rem auto;padding:0 1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}.card{background:white;border-radius:10px;padding:1rem;box-shadow:0 1px 4px #ccd}button{background:#075985;color:#fff;border:0;border-radius:5px;padding:.6rem 1rem}pre{background:#10212f;color:#d8f4ff;padding:1rem;overflow:auto}</style></head><body><header><h1>CARELINK</h1><p>Clinical care coordination</p></header><main><div class="grid"><section class="card"><h2>Workflows</h2><p>Patients · Admissions · Vitals · Medications · Investigations · Reviews · Handover · Alerts · Discharge</p><p>The API is the clinical workspace. Use the OpenAPI interface for structured data entry.</p><a href="/docs">Open API workspace</a></section><section class="card"><h2>System status</h2><button onclick="check()">Check API</button><pre id="status">Not checked</pre></section></div></main><script>async function check(){const r=await fetch('/health');document.querySelector('#status').textContent=JSON.stringify(await r.json(),null,2)}check()</script></body></html>
