[project]
name = "carelink"
version = "0.1.0"
description = "CARELINK clinical care coordination API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.30,<0.31",
  "sqlalchemy>=2.0,<2.1",
  "pydantic>=2.7,<2.10",
  "python-dotenv>=1.0,<2",
  "anyio>=4.0,<4.7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<0.29"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["frontend*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
